appId: com.mailharbor.app
productName: 邮箱资料助手
copyright: Copyright © 2026 MailHarbor

directories:
  output: release
  buildResources: resources

# 只保留中英文语言包（Electron 默认 55 种，约 49MB → 约 2MB）
electronLanguages:
  - zh-CN
  - en-US

# 最高压缩（安装包更小，构建稍慢）
compression: maximum

afterPack: scripts/after-pack.cjs

files:
  - out/**

# node-unrar-js 的 wasm 需要真实文件路径（asar 内无法 mmap）
asarUnpack:
  - node_modules/node-unrar-js/**
  - node_modules/7zip-bin/**
  - resources/**
  - package.json

# 运行时用 Electron 内置 node:sqlite，免原生模块重编译
npmRebuild: false

# ---- 自动更新：发布到 GitHub Releases ----
publish:
  provider: github
  owner: moneyfly006
  repo: mailharbor
  releaseType: release

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: MailHarbor-Setup-${version}.${ext}

nsis:
  include: resources/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 邮箱资料助手
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  # 安装包/卸载器也用自己的图标
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  icon: resources/icon.png
  artifactName: MailHarbor-${version}-${arch}.${ext}
  # 没有开发者证书时关闭签名（本地/试用）；正式分发建议配 CSC_LINK
  identity: null

dmg:
  artifactName: MailHarbor-${version}-${arch}.${ext}

linux:
  target: [AppImage]
  category: Office
