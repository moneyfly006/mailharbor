name: Release（自动升版本 → 构建 macOS + Windows → 发布）

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'
      - 'resources/**'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: '是否升版本（true=patch+1 并打 tag；false=用当前版本重打）'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: 计算版本并打 tag
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: v${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: 升 patch 版本 + 打 tag
        id: bump
        shell: bash
        run: |
          set -e
          DO_BUMP="${{ github.event.inputs.bump || 'true' }}"
          CUR=$(node -p "require('./package.json').version")
          if [ "$DO_BUMP" = "false" ]; then
            NEW="$CUR"
          else
            NEW=$(node -p "const v=require('./package.json').version.split('.').map(Number);v[2]++;v.join('.')")
            node -e "const fs=require('fs');const p=require('./package.json');p.version='$NEW';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
            git config user.name "MailHarbor Bot"
            git config user.email "bot@mailharbor.local"
            git add package.json
            git commit -m "chore(release): v$NEW [skip ci]"
            git push origin HEAD:main
          fi
          git tag -f -a "v$NEW" -m "MailHarbor v$NEW"
          git push -f origin "v$NEW"
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "新版本：$NEW"

  create-release:
    name: 创建 Release
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 创建/更新 GitHub Release（唯一入口，避免矩阵并发建出重复 release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "MailHarbor v$VERSION" --generate-notes \
              --notes "自动构建：Windows 安装包 + macOS (arm64/x64) 安装包。\n\n已安装旧版本的用户会在启动后自动升级。"
          echo "release $TAG 就绪"

  build:
    name: 构建 ${{ matrix.name }}
    needs: [version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win
          - name: macOS (Apple Silicon)
            os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 类型检查 + 单元测试
        shell: bash
        run: |
          pnpm typecheck
          pnpm test:core
          if [ "$RUNNER_OS" != "Windows" ]; then pnpm test:sqlite; fi

      - name: 构建主进程/渲染层
        run: pnpm exec electron-vite build

      - name: 打包（Windows）
        if: matrix.platform == 'win'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 打包（macOS）
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="${{ needs.version.outputs.tag }}"
          shopt -s nullglob
          FILES=(release/*.exe release/*.dmg release/*.zip release/latest*.yml release/*.blockmap)
          for f in "${FILES[@]}"; do
            [ -e "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
          echo "已上传 $((${#FILES[@]})) 个文件到 $TAG"

      - name: 上传产物（便于手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: MailHarbor-${{ matrix.platform }}-v${{ needs.version.outputs.version }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: ignore
