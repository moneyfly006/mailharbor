name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: 类型检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:core
      - run: pnpm test:seed
      - run: pnpm test:sqlite
      - name: 多邮箱兼容性（自签名 / STARTTLS / 仅发件）
        run: |
          pnpm exec electron-vite build
          xvfb-run --auto-servernum pnpm test:providers
