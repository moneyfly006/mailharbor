name: 自动升版本（代码更新 → 新版本 → 触发发布）

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'electron-builder.yml'

permissions:
  contents: write

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  bump:
    # 避免发布提交自己触发自己
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: 升级 patch 版本（0.1.0 → 0.1.1）
        id: bump
        run: |
          NEW=$(node -e "const p=require('./package.json');const v=p.version.split('.').map(Number);v[2]++;console.log(v.join('.'))")
          node -e "const fs=require('fs');const p=require('./package.json');p.version='$NEW';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "新版本：$NEW"

      - name: 提交 + 打 tag
        run: |
          git config user.name "MailHarbor Bot"
          git config user.email "bot@mailharbor.local"
          git add package.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "MailHarbor v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
